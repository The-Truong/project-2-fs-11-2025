<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Đổi mật khẩu</title>
  </head>
  <body>
    <div class="page-account">
      <div class="form-account">
        <div class="inner-title">Đổi mật khẩu</div>
        <div class="inner-desc">Vui lòng nhập mật khẩu để tiếp tục</div>
        <form class="inner-form">
          <div class="inner-group">
            <label for="password">Mật khẩu mới</label>
            <input class="inner-control" type="password" id="newPassword" name="newPassword">
          </div>
          <div class="inner-group">
            <label for="password">Xác nhận mật khẩu</label>
            <input class="inner-control" type="password" id="confirmPassword" name="confirmPassword">
          </div>
          <button class="inner-button">Thay đổi</button>
        </form>
        <div class="inner-more"><span>Bạn đã nhớ mật khẩu?</span><a href="#">Tạo tài khoản</a></div>
      </div>
    </div>
  </body>
</html>
