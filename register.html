<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Đăng ký</title>
  </head>
  <body>
    <div class="page-account">
      <div class="form-account">
        <div class="inner-title">Đăng ký</div>
        <div class="inner-desc">Tạo một tài khoản để tiếp tục</div>
        <form class="inner-form">
          <div class="inner-group">
            <label for="fullName">Họ tên *</label>
            <input class="inner-control" type="text" id="fullName" name="fullName" placeholder="Ví dụ: Lê Văn A">
          </div>
          <div class="inner-group">
            <label for="email">Email *</label>
            <input class="inner-control" type="email" id="email" name="email" placeholder="Ví dụ: levana@gmail.com">
          </div>
          <div class="inner-group">
            <label for="password">Mật khẩu *</label>
            <input class="inner-control" type="password" id="password" name="password">
          </div>
          <div class="inner-meta">
            <div class="inner-check">
              <input type="checkbox" id="agree" name="agree">
              <label for="remember">Tôi chấp nhận các điều khoản và điều kiện</label>
            </div>
          </div>
          <button class="inner-button">Đăng ký</button>
        </form>
        <div class="inner-more"><span>Bạn đã có tài khoản?</span><a href="#">Đăng nhập</a></div>
      </div>
    </div>
  </body>
</html>
