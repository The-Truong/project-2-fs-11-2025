<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Quên mật khẩu</title>
  </head>
  <body>
    <div class="page-account">
      <div class="form-account">
        <div class="inner-title">Quên mật khẩu</div>
        <div class="inner-desc">Vui lòng nhập email để tiếp tục</div>
        <form class="inner-form">
          <div class="inner-group">
            <label for="email">Email *</label>
            <input class="inner-control" type="email" id="forgotEmail" name="forgotEmail" placeholder="Ví dụ: levana@gmail.com">
          </div>
          <button class="inner-button">Gửi mã OTP</button>
        </form>
        <div class="inner-more"><span>Bạn đã nhớ mật khẩu?</span><a href="#">Đăng nhập</a></div>
      </div>
    </div>
  </body>
</html>
